name: AstroOS CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-astroos.txt pytest
      - run: pytest tests/test_time.py tests/test_schema.py
      - run: python -m astroos
